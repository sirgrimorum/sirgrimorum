<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Sirgrimorum</title>
  <defs>

    <!--
      Rebaba gradient: peaks just outside the inner circle (r≈39),
      showing the raised ridge where overflow wax is thickest.
      Tapers to dark at the outer thin edge.
    -->
    <radialGradient id="rebaba" cx="60" cy="60" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a0304"/>  <!-- deep dark center (under inner circle) -->
      <stop offset="60%"  stop-color="#3e0c14"/>  <!-- inner rebaba zone -->
      <stop offset="70%"  stop-color="#8c2a3c"/>  <!-- raised ridge peak (r≈39) -->
      <stop offset="84%"  stop-color="#561422"/>  <!-- overflow body, thinning out -->
      <stop offset="100%" stop-color="#1a0304"/>  <!-- outer thin edge, dark -->
    </radialGradient>

    <!--
      Wax surface noise: subtle displacement on the blob edge
      for an organic, hand-poured feel.
    -->
    <filter id="blobWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="turbulence" baseFrequency="0.35" numOctaves="3"
        seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>

  </defs>

  <!--
    Outer wax blob with organic edge displacement.
    Lumps at ~1:30 (upper-right), ~4:30 (lower-right),
    ~7:30 (lower-left, biggest), ~10:30 (upper-left).
  -->
  <path
    d="M 60,18
       C 72,14  98,25  103,35
       C 108,43 105,52 102,60
       C 100,70 102,87  95,95
       C 88,102  72,104  60,103
       C 50,104  38,112  33,107
       C 25,101  19,74   18,60
       C 17,46   17,30   25,25
       C 32,18   47,15   60,18 Z"
    fill="url(#rebaba)"
    filter="url(#blobWobble)"
  />

  <!-- Inner stamp impression: flat -->
  <circle cx="60" cy="60" r="36" fill="#6a1c2c"/>

  <!-- Rivet ring: 12 studs at r=34.5, evenly spaced between gear and impression edge -->
  <circle cx="94.5" cy="60.0" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="89.9" cy="77.3" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="77.3" cy="89.9" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="60.0" cy="94.5" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="42.8" cy="89.9" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="30.1" cy="77.3" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="25.5" cy="60.0" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="30.1" cy="42.8" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="42.7" cy="30.1" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="60.0" cy="25.5" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="77.3" cy="30.1" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="89.9" cy="42.7" r="1.2" fill="#1a0304" opacity="0.7"/>

  <!-- Stamp edge shadow: where the stamp rim pressed deepest into the wax -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#1a0304" stroke-width="1.5"/>

</svg>
