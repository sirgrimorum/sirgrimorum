<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Sirgrimorum</title>
  <defs>

    <!--
      Rebaba gradient: peaks just outside the inner circle (r≈39),
      showing the raised ridge where overflow wax is thickest.
      Tapers to dark at the outer thin edge.
    -->
    <radialGradient id="rebaba" cx="60" cy="60" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1a0304"/>  <!-- deep dark center (under inner circle) -->
      <stop offset="60%"  stop-color="#3e0c14"/>  <!-- inner rebaba zone -->
      <stop offset="70%"  stop-color="#8c2a3c"/>  <!-- raised ridge peak (r≈39) -->
      <stop offset="84%"  stop-color="#561422"/>  <!-- overflow body, thinning out -->
      <stop offset="100%" stop-color="#1a0304"/>  <!-- outer thin edge, dark -->
    </radialGradient>

    <!--
      Stamp impression gradient: smooth compressed surface,
      light source from upper-left.
    -->
    <radialGradient id="impression" cx="50" cy="46" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8c2a3c"/>  <!-- lighter at illuminated center -->
      <stop offset="55%"  stop-color="#6a1c2c"/>  <!-- mid -->
      <stop offset="100%" stop-color="#380a14"/>  <!-- darker at compressed edges -->
    </radialGradient>

    <!-- Gaslight sheen: small specular spot, upper-left -->
    <radialGradient id="sheen" cx="44" cy="38" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#b83c52" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b83c52" stop-opacity="0"/>
    </radialGradient>

    <!--
      Wax surface noise: subtle displacement on the blob edge
      for an organic, hand-poured feel.
    -->
    <filter id="blobWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="turbulence" baseFrequency="0.35" numOctaves="3"
        seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!--
      Grain overlay: matte dusty bloom on dried wax surface.
      Applied to a semi-transparent overlay circle.
    -->
    <filter id="grainOverlay" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4"
        stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Specular dome highlight: blurred ellipse, upper-left -->
    <filter id="specBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>

  <!--
    Outer wax blob with organic edge displacement.
    Lumps at ~1:30 (upper-right), ~4:30 (lower-right),
    ~7:30 (lower-left, biggest), ~10:30 (upper-left).
  -->
  <path
    d="M 60,18
       C 72,14  98,25  103,35
       C 108,43 105,52 102,60
       C 100,70 102,87  95,95
       C 88,102  72,104  60,103
       C 50,104  38,112  33,107
       C 25,101  19,74   18,60
       C 17,46   17,30   25,25
       C 32,18   47,15   60,18 Z"
    fill="url(#rebaba)"
    filter="url(#blobWobble)"
  />

  <!-- Inner stamp impression: the clean circle the stamp face left -->
  <circle cx="60" cy="60" r="36" fill="url(#impression)"/>

  <!-- Gaslight sheen on the smooth pressed surface -->
  <circle cx="60" cy="60" r="36" fill="url(#sheen)"/>

  <!-- Grain texture overlay: matte bloom on dried wax (opacity tuned low) -->
  <circle cx="60" cy="60" r="36" fill="#6a1c2c" opacity="0.18"
    filter="url(#grainOverlay)"/>

  <!--
    Gear-tooth border ring (debossed stamp impression).
    24 teeth, r_outer=32 / r_inner=27, inner hole at r=23.
    fill-rule evenodd creates the ring shape.
  -->
  <path
    d="M 87.0,60.0 L 92.0,61.7 L 91.3,66.7 L 86.1,67.0 L 90.4,69.9 L 88.5,74.5
       L 83.4,73.5 L 86.8,77.4 L 83.8,81.4 L 79.1,79.1 L 81.4,83.8 L 77.4,86.8
       L 73.5,83.4 L 74.5,88.5 L 69.9,90.4 L 67.0,86.1 L 66.7,91.3 L 61.7,92.0
       L 60.0,87.0 L 58.3,92.0 L 53.3,91.3 L 53.0,86.1 L 50.1,90.4 L 45.5,88.5
       L 46.5,83.4 L 42.6,86.8 L 38.6,83.8 L 40.9,79.1 L 36.2,81.4 L 33.2,77.4
       L 36.6,73.5 L 31.5,74.5 L 29.6,69.9 L 33.9,67.0 L 28.7,66.7 L 28.0,61.7
       L 33.0,60.0 L 28.0,58.3 L 28.7,53.3 L 33.9,53.0 L 29.6,50.1 L 31.5,45.5
       L 36.6,46.5 L 33.2,42.6 L 36.2,38.6 L 40.9,40.9 L 38.6,36.2 L 42.6,33.2
       L 46.5,36.6 L 45.5,31.5 L 50.1,29.6 L 53.0,33.9 L 53.3,28.7 L 58.3,28.0
       L 60.0,33.0 L 61.7,28.0 L 66.7,28.7 L 67.0,33.9 L 69.9,29.6 L 74.5,31.5
       L 73.5,36.6 L 77.4,33.2 L 81.4,36.2 L 79.1,40.9 L 83.8,38.6 L 86.8,42.6
       L 83.4,46.5 L 88.5,45.5 L 90.4,50.1 L 86.1,53.0 L 91.3,53.3 L 92.0,58.3 Z
       M 83.0,60.0 A 23 23 0 1 0 37.0,60.0 A 23 23 0 1 0 83.0,60.0 Z"
    fill="#220810"
    fill-rule="evenodd"
    opacity="0.88"
  />

  <!-- Gear ring deboss highlight: thin bright line on upper-left face -->
  <path
    d="M 87.0,60.0 L 92.0,61.7 L 91.3,66.7 L 86.1,67.0 L 90.4,69.9 L 88.5,74.5
       L 83.4,73.5 L 86.8,77.4 L 83.8,81.4 L 79.1,79.1 L 81.4,83.8 L 77.4,86.8
       L 73.5,83.4 L 74.5,88.5 L 69.9,90.4 L 67.0,86.1 L 66.7,91.3 L 61.7,92.0
       L 60.0,87.0 L 58.3,92.0 L 53.3,91.3 L 53.0,86.1 L 50.1,90.4 L 45.5,88.5
       L 46.5,83.4 L 42.6,86.8 L 38.6,83.8 L 40.9,79.1 L 36.2,81.4 L 33.2,77.4
       L 36.6,73.5 L 31.5,74.5 L 29.6,69.9 L 33.9,67.0 L 28.7,66.7 L 28.0,61.7
       L 33.0,60.0 L 28.0,58.3 L 28.7,53.3 L 33.9,53.0 L 29.6,50.1 L 31.5,45.5
       L 36.6,46.5 L 33.2,42.6 L 36.2,38.6 L 40.9,40.9 L 38.6,36.2 L 42.6,33.2
       L 46.5,36.6 L 45.5,31.5 L 50.1,29.6 L 53.0,33.9 L 53.3,28.7 L 58.3,28.0
       L 60.0,33.0 L 61.7,28.0 L 66.7,28.7 L 67.0,33.9 L 69.9,29.6 L 74.5,31.5
       L 73.5,36.6 L 77.4,33.2 L 81.4,36.2 L 79.1,40.9 L 83.8,38.6 L 86.8,42.6
       L 83.4,46.5 L 88.5,45.5 L 90.4,50.1 L 86.1,53.0 L 91.3,53.3 L 92.0,58.3 Z
       M 83.0,60.0 A 23 23 0 1 0 37.0,60.0 A 23 23 0 1 0 83.0,60.0 Z"
    fill="none"
    fill-rule="evenodd"
    stroke="#9b3d50"
    stroke-width="0.6"
    opacity="0.35"
    transform="translate(-0.5,-0.5)"
  />

  <!-- Separator ring: thin border between center motif area and gear ring -->
  <circle cx="60" cy="60" r="23" fill="none" stroke="#1a0304" stroke-width="0.8"/>

  <!-- Rivet ring: 12 studs at r=34.5, evenly spaced between gear and impression edge -->
  <circle cx="94.5" cy="60.0" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="89.9" cy="77.3" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="77.3" cy="89.9" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="60.0" cy="94.5" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="42.8" cy="89.9" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="30.1" cy="77.3" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="25.5" cy="60.0" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="30.1" cy="42.8" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="42.7" cy="30.1" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="60.0" cy="25.5" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="77.3" cy="30.1" r="1.2" fill="#1a0304" opacity="0.7"/>
  <circle cx="89.9" cy="42.7" r="1.2" fill="#1a0304" opacity="0.7"/>

  <!-- Stamp edge shadow: where the stamp rim pressed deepest into the wax -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#1a0304" stroke-width="1.5"/>

  <!--
    Specular dome highlight: the single element that sells "pooled wax".
    Small blurred white ellipse, upper-left of center.
  -->
  <ellipse cx="47" cy="44" rx="13" ry="9"
    fill="white" opacity="0.22" filter="url(#specBlur)"/>

</svg>
