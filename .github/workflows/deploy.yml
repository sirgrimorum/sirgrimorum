name: Deploy web-sirgrimorum

on:
  push:
    branches: [main]
    paths:
      - 'apps/web-sirgrimorum/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web-sirgrimorum/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-sirgrimorum
        run: npm ci

      - name: Build
        working-directory: apps/web-sirgrimorum
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync apps/web-sirgrimorum/dist/ s3://${{ vars.MARKETING_S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync apps/web-sirgrimorum/dist/ s3://${{ vars.MARKETING_S3_BUCKET }} \
            --delete \
            --cache-control "no-cache" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"
